services:
  - type: web
    name: vioraplay
    runtime: node
    # free = 免费、闲置 15 分钟休眠；验证通过后在 Render 后台升级 starter（常驻不冷启动）
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /en
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://www.vioraplay.com
      - key: NEXT_PUBLIC_GA4_ID
        value: G-TBB4KBRL2D
      - key: NEXT_PUBLIC_BING_VERIFICATION
        sync: false
      - key: NEXT_PUBLIC_ADSENSE_CLIENT
        value: "ca-pub-2269516311541291"
